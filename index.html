      rel="stylesheet"
    />
    <script>
      (function () {
        const originalDefineProperty = Object.defineProperty;
        Object.defineProperty = function (obj, prop, descriptor) {
          if (prop === 'ethereum' && (obj === window || obj === globalThis)) {
            try {
              return originalDefineProperty.apply(this, arguments);
            } catch (err) {
              console.warn('[Wallet-Guard] Handled duplicate window.ethereum injection:', err.message);
              return obj;
            }
          }
          return originalDefineProperty.apply(this, arguments);
        };
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
